name: Setup and Build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -oq Microbes-repo.zip -x ".github/*"
          rm -f Microbes-repo.zip MicrobesMix-2.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add project files" || true
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: microbes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.0 app/build/outputs/apk/debug/microbes-debug.apk \
            --title "Microbes 4.0" \
            --notes "Modern remake of the classic Microbes live wallpaper."
